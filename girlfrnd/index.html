<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12070f" />
    <title>Enter the Memories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Montserrat:wght@400;500;600&family=Parisienne&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-page">
    <main class="secret-card">
      <p class="corner-note">
        Some stories are<br />
        not just written,<br />
        they are felt....<br />
        and this one is ours
      </p>
      <h1>Hey Chintu ♡</h1>
      <p class="instruction">Enter the password to unlock our memories</p>
      <form class="secret-form" id="secretForm">
        <label class="sr-only" for="secretPassword">Password</label>
        <input
          type="password"
          id="secretPassword"
          name="password"
          placeholder="Enter password"
          autocomplete="off"
          autofocus
          required
        />
        <button type="submit">Unlock ♡</button>
      </form>
      <p class="error-message" id="errorMessage"></p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
